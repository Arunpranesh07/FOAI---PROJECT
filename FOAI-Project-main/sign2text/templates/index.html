<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sign2Text - Sign Language to Text Translation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 1rem 1rem;
        }

        .header h1 {
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .header h4 {
            font-weight: 400;
            color: #e0e0e0;
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 2rem 1rem;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-card img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #fff;
            object-fit: cover;
            max-height: 300px;
        }

        .controls {
            margin-top: 1rem;
            width: 100%;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .controls input {
            flex: 1;
            border-radius: 8px;
            border: none;
            padding: 0.5rem 0.75rem;
        }

        .controls button {
            border-radius: 8px;
            border: none;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }

        #socketStatus {
            margin-top: 0.5rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            width: fit-content;
        }

        @media(max-width:768px) {
            .card-container {
                flex-direction: column;
                align-items: center;
            }
        }

    </style>
</head>

<body>
    <div class="header">
        <h1>Sign-2-Text</h1>
        <h4>Convert Sign Language to Text Live</h4>
    </div>

    <div class="card-container">
        <!-- Video Feed Card -->
        <div class="video-card">
            <img src="{{ url_for('video_feed') }}" alt="Video Feed">
            <div class="controls">
                <input type="text" id="translatedText" placeholder="Translated text will appear here">
                <div style="display:flex; gap:0.5rem; align-items:center;">
                    <input id="letterInput" type="text" maxlength="1" placeholder="a-z" style="width:48px; text-transform:lowercase; text-align:center;" aria-label="single letter">
                    <button id="addLetterButton" class="btn btn-secondary">Add Letter</button>
                </div>
                <button id="resetButton" class="btn btn-danger">Reset</button>
                <button id="speakButton" class="btn btn-primary">Speak</button>
            </div>
            <div id="socketStatus" style="background: rgba(220,53,69,0.6);">Socket: disconnected</div>
        </div>
        <!-- Debug log to help tune prediction suppression -->
        <div class="video-card" style="max-width:400px;">
            <h5>Debug Log</h5>
            <div id="debugLog" style="background:rgba(0,0,0,0.2); padding:0.5rem; border-radius:8px; max-height:200px; overflow:auto; width:100%; font-size:0.9rem;"></div>
            <div style="margin-top:0.5rem; font-size:0.85rem; color:#ddd">Cooldown and fuzzy threshold (tune while model runs)</div>
            <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.5rem;">
                <label style="width:120px; font-size:0.85rem;">Cooldown (ms)</label>
                <input id="cooldownRange" type="range" min="200" max="5000" step="100" value="1500" style="flex:1;">
                <div id="cooldownValue" style="width:60px; text-align:right;">1500</div>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.25rem;">
                <label style="width:120px; font-size:0.85rem;">Fuzzy threshold</label>
                <input id="fuzzyRange" type="range" min="0" max="100" step="1" value="75" style="flex:1;">
                <div id="fuzzyValue" style="width:60px; text-align:right;">0.75</div>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.25rem;">
                <label style="width:120px; font-size:0.85rem;">Letter commit delay</label>
                <input id="letterDelayRange" type="range" min="100" max="2000" step="50" value="500" style="flex:1;">
                <div id="letterDelayValue" style="width:60px; text-align:right;">500</div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

    <script>
        // Socket setup
        const socket = io();
        const socketStatus = document.getElementById('socketStatus');

        socket.on('connect', () => {
            socketStatus.innerText = 'Socket: connected';
            socketStatus.style.background = 'rgba(40,167,69,0.6)';
        });

        socket.on('disconnect', () => {
            socketStatus.innerText = 'Socket: disconnected';
            socketStatus.style.background = 'rgba(220,53,69,0.6)';
        });

    // Track last accepted token and time to suppress near-duplicates
    let lastAcceptedToken = null;
    let lastAcceptedTime = 0;
    // Fuzzy threshold: normalized similarity above this is considered duplicate (0..1)
    let FUZZY_THRESHOLD = 0.75;
    // Cooldown in ms (can be tuned live)
    let COOLDOWN_MS = 1500;

    function logDebug(message) {
        const el = document.getElementById('debugLog');
        if (!el) return;
        const line = document.createElement('div');
        line.innerText = `${new Date().toLocaleTimeString()} - ${message}`;
        el.prepend(line);
        // keep at most 200 lines
        while (el.children.length > 200) el.removeChild(el.lastChild);
    }

    // Simple Levenshtein distance-based similarity (returns 0..1, 1 == identical)
    function levenshtein(a, b) {
        if (a === b) return 1;
        const al = a.length, bl = b.length;
        if (al === 0) return bl === 0 ? 1 : 0;
        if (bl === 0) return 0;
        const dp = Array(al + 1).fill(null).map(() => Array(bl + 1).fill(0));
        for (let i = 0; i <= al; i++) dp[i][0] = i;
        for (let j = 0; j <= bl; j++) dp[0][j] = j;
        for (let i = 1; i <= al; i++) {
            for (let j = 1; j <= bl; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
            }
        }
        const dist = dp[al][bl];
        const maxLen = Math.max(al, bl);
        return 1 - (dist / maxLen);
    }

    // Live controls wiring
    const cooldownRange = document.getElementById('cooldownRange');
    const cooldownValue = document.getElementById('cooldownValue');
    const fuzzyRange = document.getElementById('fuzzyRange');
    const fuzzyValue = document.getElementById('fuzzyValue');

    if (cooldownRange && cooldownValue) {
        cooldownRange.addEventListener('input', (e) => {
            COOLDOWN_MS = Number(e.target.value);
            cooldownValue.innerText = COOLDOWN_MS;
        });
    }
    if (fuzzyRange && fuzzyValue) {
        fuzzyRange.addEventListener('input', (e) => {
            const pct = Number(e.target.value);
            FUZZY_THRESHOLD = pct / 100;
            fuzzyValue.innerText = FUZZY_THRESHOLD.toFixed(2);
        });
    }

        // Append a single letter from the manual input when button clicked
        document.getElementById('addLetterButton').addEventListener('click', () => {
            const input = document.getElementById('letterInput');
            const translatedText = document.getElementById('translatedText');
            const ch = String(input.value || '').trim().toLowerCase();
            if (/^[a-z]$/.test(ch)) {
                translatedText.value += ch;
                input.value = '';
                input.focus();
            }
        });

        // Better prediction handling: ignore repeated predictions within short time window
        socket.on('prediction', function (data) {
            const translatedText = document.getElementById('translatedText');
            const raw = String(data.text || '');
            const txt = raw.trim();
            const now = Date.now();

            if (!txt) return;

            // Special-case 'Done' (case-insensitive) as a word boundary
            if (txt.toLowerCase() === 'done') {
                if (!translatedText.value.endsWith(' ')) translatedText.value += ' ';
                lastAcceptedToken = null;
                lastAcceptedTime = now;
                return;
            }

            // Normalize token for duplicate suppression: lowercase + remove non-alphanumerics
            const norm = txt.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!norm) return;

            // If it's a single letter (A-Z or a-z) appended by the model, accept once.
            if (/^[a-z]$/.test(norm)) {
                // If same normalized token and within cooldown, ignore
                if (norm === lastAcceptedToken && (now - lastAcceptedTime) < COOLDOWN_MS) {
                    logDebug(`SUPPRESSED letter '${norm}' (cooldown)`);
                    return;
                }
                translatedText.value += norm;
                lastAcceptedToken = norm;
                lastAcceptedTime = now;
                logDebug(`ACCEPTED letter '${norm}'`);
                return;
            }

            // For multi-character words, check fuzzy similarity to lastAcceptedToken first
            if (lastAcceptedToken) {
                const similarity = levenshtein(norm, lastAcceptedToken);
                if (similarity >= FUZZY_THRESHOLD && (now - lastAcceptedTime) < COOLDOWN_MS) {
                    logDebug(`SUPPRESSED '${txt}' (similar to '${lastAcceptedToken}', sim=${similarity.toFixed(2)})`);
                    return;
                }
            }

            // Append with spacing rules using the lowercased original text
            const toAppend = txt.toLowerCase();
            if (translatedText.value.length > 0 && !translatedText.value.endsWith(' '))
                translatedText.value += ' ' + toAppend;
            else translatedText.value += toAppend;

            lastAcceptedToken = norm;
            lastAcceptedTime = now;
            logDebug(`ACCEPTED '${txt}' (norm='${norm}')`);
        });

        document.getElementById('resetButton').addEventListener('click', () => {
            document.getElementById('translatedText').value = '';
        });

        document.getElementById('speakButton').addEventListener('click', () => {
            const text = document.getElementById('translatedText').value;
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = speechSynthesis.getVoices();
            utterance.voice = voices.find(v => v.name === 'Google UK English Female') || voices[0];
            utterance.rate = 1.0;
            speechSynthesis.speak(utterance);
        });
    </script>
    <!-- Add this inside <body> at the end, just before </body> -->
<!-- Floating Chatbot Button -->
<a href="http://localhost:5001" target="_blank" id="chatbotButton" title="Open Chatbot"></a>

<style>
    #chatbotButton {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #4e54c8, #8f94fb);
        border-radius: 50%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        transition: all 0.3s ease;
        z-index: 9999;
    }

    #chatbotButton:hover {
        transform: scale(1.1);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    #chatbotButton::before {
        content: "\f086"; /* Font Awesome chat icon */
        font-family: "Font Awesome 5 Free";
        font-weight: 900;
        color: white;
        font-size: 28px;
    }
</style>

</body>

</html>
